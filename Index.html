                                <div className="glass-card rounded-2xl p-4 min-h-[300px] flex flex-col justify-center items-center text-center relative overflow-hidden group">
                                    <img 
                                        src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80" 
                                        alt="Map Location Placeholder"
                                        className="absolute inset-0 w-full h-full object-cover filter opacity-30 group-hover:scale-105 transition-transform duration-700"
                                    />
                                    <div className="relative z-10 p-6 bg-charcoal-900/90 border border-gold-500/20 rounded-xl">
                                        <i data-lucide="map-pin" className="w-8 h-8 text-gold-400 mx-auto mb-2"></i>
                                        <h4 className="font-serif font-bold text-white text-lg">Location Map Placeholder</h4>
                                        <p className="text-xs text-slate-400 mt-1">Interactive Google Maps integration can be connected here.</p>
                                    </div>
                                </div>

                                {/* Quick Contact Form */}
                                <div className="glass-card rounded-2xl p-8">
                                    <h3 className="text-xl font-serif font-bold text-white mb-4">Send a Message</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); alert('Message sent to Dhanraj!'); }} className="space-y-4">
                                        <input 
                                            type="text" 
                                            placeholder="Your Name" 
                                            required 
                                            className="w-full bg-charcoal-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-gold-500"
                                        />
                                        <input 
                                            type="email" 
                                            placeholder="Your Email" 
                                            required 
                                            className="w-full bg-charcoal-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-gold-500"
                                        />
                                        <textarea 
                                            rows="3" 
                                            placeholder="Message..." 
                                            required 
                                            className="w-full bg-charcoal-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-gold-500"
                                        ></textarea>
                                        <button 
                                            type="submit"
                                            className="w-full py-3 bg-gold-500 hover:bg-gold-400 text-charcoal-950 font-bold rounded-lg text-sm transition-colors"
                                        >
                                            Send Message
                                        </button>
                                    </form>
                                </div>

                            </div>
                        </div>
                    </section>


                    {/* --- FOOTER --- */}
                    <footer className="bg-charcoal-950 border-t border-gold-500/20 pt-16 pb-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
                                
                                <div className="space-y-4">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-8 h-8 rounded-full bg-gold-500/20 flex items-center justify-center text-gold-400">
                                            <i data-lucide="utensils" className="w-4 h-4"></i>
                                        </div>
                                        <span className="font-serif font-bold text-xl gold-gradient-text">Azarbaijan</span>
                                    </div>
                                    <p className="text-slate-400 text-xs leading-relaxed">
                                        Bringing royal flavor and authentic Indian dining experiences under the guidance of Dhanraj.
                                    </p>
                                    <div className="text-xs text-gold-400 font-semibold">
                                        Owner: Dhanraj
                                    </div>
                                </div>

                                <div>
                                    <h4 className="font-serif font-bold text-white text-sm mb-4">Quick Links</h4>
                                    <ul className="space-y-2 text-xs text-slate-400">
                                        <li><a href="#home" className="hover:text-gold-400">Home</a></li>
                                        <li><a href="#about" className="hover:text-gold-400">About Us</a></li>
                                        <li><a href="#menu" className="hover:text-gold-400">Digital Menu</a></li>
                                        <li><a href="#gallery" className="hover:text-gold-400">Gallery</a></li>
                                        <li><a href="#booking" className="hover:text-gold-400">Book A Table</a></li>
                                    </ul>
                                </div>

                                <div>
                                    <h4 className="font-serif font-bold text-white text-sm mb-4">Contact</h4>
                                    <ul className="space-y-2 text-xs text-slate-400">
                                        <li>Phone: <a href="tel:56768889" className="text-gold-400 hover:underline">56768889</a></li>
                                        <li>Address: Restaurant Address — Add address here</li>
                                        <li>Open: 12:00 PM - 11:00 PM</li>
                                    </ul>
                                </div>

                                <div>
                                    <h4 className="font-serif font-bold text-white text-sm mb-4">Follow Us</h4>
                                    <div className="flex space-x-3 text-slate-400">
                                        <a href="#" className="p-2.5 rounded-full bg-charcoal-800 border border-gold-500/10 hover:text-gold-400 hover:border-gold-500/40">
                                            <i data-lucide="instagram" className="w-4 h-4"></i>
                                        </a>
                                        <a href="#" className="p-2.5 rounded-full bg-charcoal-800 border border-gold-500/10 hover:text-gold-400 hover:border-gold-500/40">
                                            <i data-lucide="facebook" className="w-4 h-4"></i>
                                        </a>
                                        <a href="#" className="p-2.5 rounded-full bg-charcoal-800 border border-gold-500/10 hover:text-gold-400 hover:border-gold-500/40">
                                            <i data-lucide="message-square" className="w-4 h-4"></i>
                                        </a>
                                    </div>
                                </div>

                            </div>

                            <div className="border-t border-slate-900 pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500">
                                <div>© 2026 Azarbaijan Restaurant. All Rights Reserved.</div>
                                <div className="mt-2 sm:mt-0">Owner: Dhanraj | Phone: 56768889</div>
                            </div>
                        </div>
                    </footer>


                    {/* --- OWNER ADMIN DASHBOARD MODAL --- */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-charcoal-900 border border-gold-500/30 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden my-8">
                                
                                <div className="bg-charcoal-800 border-b border-gold-500/20 p-5 flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <i data-lucide="lock" className="w-5 h-5 text-gold-400"></i>
                                        <h3 className="font-serif font-bold text-white text-lg">
                                            Owner Booking Dashboard (Dhanraj)
                                        </h3>
                                    </div>
                                    <button 
                                        onClick={() => setIsAdminOpen(false)}
                                        className="text-slate-400 hover:text-white p-1"
                                    >
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                {!adminAuthenticated ? (
                                    <form onSubmit={handleAdminLogin} className="p-8 max-w-md mx-auto text-center space-y-4">
                                        <div className="w-16 h-16 rounded-full bg-gold-500/10 border border-gold-500/30 flex items-center justify-center mx-auto text-gold-400">
                                            <i data-lucide="lock" className="w-8 h-8"></i>
                                        </div>
                                        <h4 className="text-white font-serif font-bold text-xl">Owner Passcode Required</h4>
                                        <p className="text-slate-400 text-xs">
                                            Enter security code to view and manage table bookings. <br />
                                            <span className="text-gold-400 font-mono">(Demo passcode: admin123 or 1234)</span>
                                        </p>

                                        {adminPassError && (
                                            <div className="text-xs text-rose-400 bg-rose-950/50 p-2 rounded border border-rose-800">
                                                {adminPassError}
                                            </div>
                                        )}

                                        <input 
                                            type="password" 
                                            placeholder="Enter Admin Passcode"
                                            value={adminPasscode}
                                            onChange={(e) => setAdminPasscode(e.target.value)}
                                            className="w-full bg-charcoal-950 border border-slate-700 rounded-lg p-3 text-center text-white focus:outline-none focus:border-gold-500 tracking-widest font-mono"
                                        />

                                        <button 
                                            type="submit"
                                            className="w-full py-3 bg-gold-500 hover:bg-gold-400 text-charcoal-950 font-bold rounded-lg text-sm"
                                        >
                                            Access Dashboard
                                        </button>
                                    </form>
                                ) : (
                                    <div className="p-6 space-y-6">
                                        <div className="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center bg-charcoal-950 p-4 rounded-xl border border-slate-800">
                                            <div className="flex-1 flex gap-2">
                                                <input 
                                                    type="text" 
                                                    placeholder="Search by Name or ID..."
                                                    value={adminSearchTerm}
                                                    onChange={(e) => setAdminSearchTerm(e.target.value)}
                                                    className="w-full bg-charcoal-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                                                />
                                                <input 
                                                    type="date" 
                                                    value={adminFilterDate}
                                                    onChange={(e) => setAdminFilterDate(e.target.value)}
                                                    className="bg-charcoal-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white"
                                                />
                                            </div>

                                            <div className="flex items-center space-x-2">
                                                <span className="text-xs text-slate-400">Filter:</span>
                                                {['All', 'Pending', 'Confirmed', 'Completed', 'Cancelled'].map((st) => (
                                                    <button
                                                        key={st}
                                                        onClick={() => setAdminFilterStatus(st)}
                                                        className={`px-3 py-1 rounded text-xs font-medium ${
                                                            adminFilterStatus === st 
                                                                ? 'bg-gold-500 text-black font-bold' 
                                                                : 'bg-charcoal-800 text-slate-300'
                                                        }`}
                                                    >
                                                        {st}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto border border-slate-800 rounded-xl">
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-charcoal-800 text-gold-400 uppercase font-mono border-b border-slate-800">
                                                    <tr>
                                                        <th className="p-3">ID</th>
                                                        <th className="p-3">Customer</th>
                                                        <th className="p-3">Date & Time</th>
                                                        <th className="p-3">Guests</th>
                                                        <th className="p-3">Status</th>
                                                        <th className="p-3 text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {filteredBookings.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="6" className="p-8 text-center text-slate-500">
                                                                No bookings found matching filters.
                                                            </td>
                                                        </tr>
                                                    ) : (
                                                        filteredBookings.map((b) => (
                                                            <tr key={b.id} className="hover:bg-charcoal-800/50">
                                                                <td className="p-3 font-mono font-bold text-gold-400">{b.id}</td>
                                                                <td className="p-3">
                                                                    <div className="font-bold text-white">{b.name}</div>
                                                                    <div className="text-[11px] text-slate-400">{b.phone} | {b.email}</div>
                                                                    {b.specialRequest && (
                                                                        <div className="text-[10px] text-amber-300 italic mt-0.5">"{b.specialRequest}"</div>
                                                                    )}
                                                                </td>
                                                                <td className="p-3">{b.date} <br /><span className="text-slate-400">{b.time}</span></td>
                                                                <td className="p-3">{b.guests} ({b.seating})</td>
                                                                <td className="p-3">
                                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                                        b.status === 'Confirmed' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                                                        b.status === 'Pending' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                                                        b.status === 'Completed' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                                                                        'bg-rose-500/20 text-rose-400 border border-rose-500/30'
                                                                    }`}>
                                                                        {b.status}
                                                                    </span>
                                                                </td>
                                                                <td className="p-3 text-right space-x-1">
                                                                    {b.status !== 'Confirmed' && (
                                                                        <button 
                                                                            onClick={() => updateBookingStatus(b.id, 'Confirmed')}
                                                                            className="px-2 py-1 bg-emerald-900/60 text-emerald-300 border border-emerald-700 rounded hover:bg-emerald-800"
                                                                            title="Confirm Booking"
                                                                        >
                                                                            Confirm
                                                                        </button>
                                                                    )}
                                                                    {b.status !== 'Completed' && b.status === 'Confirmed' && (
                                                                        <button 
                                                                            onClick={() => updateBookingStatus(b.id, 'Completed')}
                                                                            className="px-2 py-1 bg-blue-900/60 text-blue-300 border border-blue-700 rounded hover:bg-blue-800"
                                                                            title="Mark Completed"
                                                                        >
                                                                            Complete
                                                                        </button>
                                                                    )}
                                                                    <button 
                                                                        onClick={() => deleteBooking(b.id)}
                                                                        className="px-2 py-1 bg-rose-950 text-rose-400 border border-rose-800 rounded hover:bg-rose-900"
                                                                        title="Cancel / Delete"
                                                                    >
                                                                        Remove
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="flex justify-between items-center text-xs text-slate-500 pt-2">
                                            <span>Total Bookings Stored: {bookings.length}</span>
                                            <button 
                                                onClick={() => setAdminAuthenticated(false)} 
                                                className="text-gold-400 hover:underline"
                                            >
                                                Lock Dashboard
                                            </button>
                                        </div>

                                    </div>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
